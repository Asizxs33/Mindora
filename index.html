<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4fc">
  <meta name="description" content="Mindora — учебный напарник. Выбирай цель, проходи задания и создавай свои проекты.">
  <title>Mindora</title>
  <link rel="icon" href="/assets/mindora-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900;1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/adventure.css">
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="topbar">
    <a class="brand" href="#discover" aria-label="Mindora, главная"><span class="brand-mascot" aria-hidden="true"></span>Mindora</a>
    <nav id="top-navigation" aria-label="Разделы сайта"></nav>
    <div class="top-actions" id="top-actions"></div>
  </header>
  <aside class="sidebar" aria-label="Главное меню">
    <nav id="navigation" aria-label="Навигация"></nav>
    <button class="side-promo" data-action="about">
      <span class="promo-mascot mascot-study" aria-hidden="true"></span>
      <strong>Учись<br>с Mindora!</strong>
      <span>Короткие уроки, практика и реальный прогресс.</span>
    </button>
  </aside>
  <div class="app-shell">
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="mobile-navigation" id="mobile-navigation" aria-label="Главное меню"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title">
    <button class="modal-close icon-button" data-action="close-modal" aria-label="Закрыть окно">×</button>
    <div id="modal-content"></div>
  </dialog>
  <noscript><p class="noscript">Включи JavaScript, чтобы пользоваться Mindora.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
